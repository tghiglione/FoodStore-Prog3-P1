<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store | Catálogo</title>
    <link rel="stylesheet" href="../../../style.css">
</head>

<body class="app">
    <header class="header">
        <a class="header__brand" href="./home.html">Food Store</a>

        <nav class="header__nav">
            <a class="header__link header__link--active" href="./home.html">Catálogo</a>
            <a class="header__link" href="../cart/cart.html">Carrito <span id="cartCount" class="badge">0</span>
            </a>
            <button id="logoutButton" class="btn btn--ghost" type="button">Cerrar sesión</button>
        </nav>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2 class="sidebar__title">Categorías</h2>
            <ul id="listaCategorias" class="categorias"></ul>
        </aside>

        <main class="catalogo">
            <div class="catalogo__top">
                <h1 id="tituloCatalogo" class="catalogo__titulo">Todos los productos</h1>

                <label class="buscador">
                    <span class="sr-only">Buscar productos por nombre</span>
                    <input type="search" id="inputBusqueda" class="buscador__input"
                        placeholder="Buscar por nombre..." autocomplete="off">
                </label>
            </div>

            <p id="resultadoInfo" class="catalogo__info"></p>

            <!-- Contenedor de productos -->
            <section id="gridProductos" class="grid" aria-live="polite"></section>

            <div id="sinResultados" class="vacio" hidden>
                <p id="sinResultadosTexto" class="vacio__texto">No encontramos productos.</p>
                <button id="btnLimpiarFiltros" class="btn btn--primary" type="button">Ver catálogo completo</button>
            </div>
        </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./home.ts"></script>
</body>

</html>
